[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kernelfactory"
version = "1.0.0"
description = "KernelFactory：Kernel 自动生成的搜索闭环（硬约束 = 数值正确性）"
requires-python = ">=3.12"
#: **核心路径零第三方依赖** —— 只用标准库。
#: 本机没有 torch / triton / numpy，也没有可用 GPU（`nvidia-smi` 起不来），
#: 所以本项目交付的是**数值孪生**：真的用 Python 浮点跑一遍分块累加，
#: 真的把「丢了多少位」测出来 —— 而不是把 kernel 编译出来跑。
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
#: 本项目**只做运行时核对**（不建 tests/）：
#: 关键不变量做成流水线自身的运行时核对 —— 验收门槛 + 对抗用例 + 期望表。
#: 这个段保留，是为了哪天要加测试时不用再想 addopts 写什么。
addopts = "-q"
testpaths = ["tests"]
